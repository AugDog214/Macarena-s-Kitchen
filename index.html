<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Macarena's Kitchen | Temporarily Closed</title>
  <meta name="description" content="Macarena's Kitchen is temporarily closed. We will be back soon.">
  <meta name="theme-color" content="#650d0d">
  <link rel="canonical" href="https://macarenaskitchen.com/">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <style>
    @font-face {
      font-family: "Gloucester";
      src: url("assets/fonts/gloucester-mt-extra-condensed.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #650d0d;
      color: #fff4d2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: #650d0d;
    }

    main {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(18px, 4vh, 38px) 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: clamp(12px, 2vh, 22px);
      color: #ffd934;
    }

    .brand::before,
    .brand::after {
      content: "";
      width: clamp(26px, 7vw, 72px);
      height: 1px;
      background: #c99c36;
    }

    .brand-logo {
      width: clamp(42px, 7vw, 60px);
      height: clamp(42px, 7vw, 60px);
      object-fit: contain;
    }

    .brand-name {
      margin: 0;
      font-family: "Gloucester", Georgia, serif;
      font-size: clamp(2rem, 7vw, 3.8rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
      text-align: center;
    }

    .scene {
      container-type: inline-size;
      position: relative;
      width: min(92vw, 640px, calc((100svh - 130px) * 0.8));
      aspect-ratio: 4 / 5;
      isolation: isolate;
    }

    .scene-art {
      position: absolute;
      inset: 0;
      z-index: -1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scene-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sign-message {
      position: absolute;
      top: 7.2%;
      left: 15%;
      width: 70%;
      height: 35.5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2b251e;
      text-align: center;
      text-wrap: balance;
    }

    .sign-message p {
      margin: 0;
      letter-spacing: 0;
    }

    .apology {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 4.4cqw;
      font-style: italic;
      line-height: 1;
    }

    .status {
      margin-top: 1.5cqw !important;
      font-family: "Gloucester", Georgia, serif;
      font-size: 12.5cqw;
      line-height: 0.78;
      color: #790f0f;
      text-transform: uppercase;
    }

    .temporary {
      margin-top: 1.7cqw !important;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 4.2cqw;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
    }

    .return {
      width: 74%;
      margin-top: 3cqw !important;
      padding-top: 2cqw;
      border-top: 1px solid #b58b43;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 3.6cqw;
      font-weight: 700;
      line-height: 1.1;
      color: #650d0d;
      text-transform: uppercase;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-height: 660px) {
      main {
        padding-block: 12px;
      }

      .brand {
        margin-bottom: 8px;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
      }

      .brand-name {
        font-size: 2.2rem;
      }

      .scene {
        width: min(90vw, calc((100svh - 74px) * 0.8));
      }
    }

  </style>
</head>
<body>
  <main>
    <header class="brand" aria-label="Macarena's Kitchen">
      <img class="brand-logo" src="assets/logo.png" alt="" width="60" height="60">
      <h1 class="brand-name">Macarena's Kitchen</h1>
    </header>

    <figure class="scene">
      <picture class="scene-art">
        <source media="(prefers-reduced-motion: reduce)" srcset="assets/closure-iguana-scene-static.webp">
        <source type="image/webp" srcset="assets/closure-iguana-scene.webp?v=6">
        <img
          src="assets/closure-iguana-scene-full.gif?v=6"
          alt="A green iguana perched on a tree branch and holding a wooden sign"
          width="640"
          height="800"
        >
      </picture>
      <figcaption class="sign-message">
        <p class="apology">We are sorry,</p>
        <p class="status">we're 86</p>
        <p class="temporary">temporary.</p>
        <p class="return">We will be back soon!</p>
      </figcaption>
    </figure>

    <p class="sr-only">We are sorry, we're 86 temporary. We will be back soon!</p>
  </main>
</body>
</html>
